<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>C++ Programming Projects</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        /* ================= HEADER ================= */

        .hero {
            background: linear-gradient(135deg, #111827, #1f2937);
            color: white;
            padding: 80px 20px;
            text-align: center;
        }

        .hero-icon {
            font-size: 55px;
            margin-bottom: 15px;
            color: #f59e0b;
        }

        .hero h1 {
            font-size: 45px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
            color: #d1d5db;
        }

        /* ================= PROJECT SECTION ================= */

        .projects-section {
            padding: 70px 0;
        }

        .section-title {
            text-align: center;
            margin-bottom: 45px;
        }

        .section-title h2 {
            font-size: 32px;
            font-weight: 700;
            color: #1f2937;
        }

        .section-title p {
            color: #6b7280;
            margin-top: 10px;
        }

        /* ================= CARD ================= */

        .project-card {
            background: white;
            border: none;
            border-radius: 18px;
            padding: 35px 25px;
            height: 100%;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            text-align: center;
        }

        .project-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 35px rgba(31, 41, 55, 0.18);
        }

        /* ================= ICON ================= */

        .project-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #fef3c7;
            color: #d97706;

            border-radius: 50%;
            font-size: 32px;

            transition: 0.3s;
        }

        .project-card:hover .project-icon {
            background: #d97706;
            color: white;
        }

        /* ================= CARD TEXT ================= */

        .project-card h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #1f2937;
        }

        .project-card h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #d97706;
        }

        .project-card p {
            color: #6b7280;
            line-height: 1.6;
            min-height: 75px;
        }

        /* ================= BUTTON ================= */

        .project-btn {
            display: inline-block;
            margin-top: 15px;

            background: #1f2937;
            color: white;

            padding: 11px 22px;
            border-radius: 7px;

            text-decoration: none;
            font-weight: 600;

            transition: 0.3s;
        }

        .project-btn:hover {
            background: #d97706;
            color: white;
            transform: translateY(-2px);
        }

        /* ================= FOOTER ================= */

        footer {
            background: #111827;
            color: white;
            text-align: center;
            padding: 25px 15px;
            margin-top: 20px;
        }

        footer p {
            margin: 0;
            color: #d1d5db;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 768px) {

            .hero {
                padding: 60px 20px;
            }

            .hero h1 {
                font-size: 32px;
            }

            .hero p {
                font-size: 16px;
            }

        }

        @media (max-width: 576px) {

            .projects-section {
                padding: 50px 15px;
            }

            .section-title h2 {
                font-size: 28px;
            }

            .project-card {
                padding: 30px 20px;
            }

            .project-card h2 {
                font-size: 20px;
            }

        }
    </style>

</head>

<body>


    <!-- ================= HERO ================= -->

    <section class="hero">

        <div class="container">

            <div class="hero-icon">
                <i class="bi bi-code-slash"></i>
            </div>

            <h1>C++ Programming Projects</h1>

            <p>
                My C++ Programming Practice Programs
            </p>

        </div>

    </section>


    <!-- ================= PROJECTS ================= -->

    <section class="projects-section">

        <div class="container">

            <div class="section-title">

                <h2>My Projects</h2>

                <p>
                    Select a category to view all programs
                </p>

            </div>


            <div class="row g-4">


                <!-- ================= PROJECT 1 ================= -->

                <div class="col-lg-6 col-md-6">

                    <div class="project-card">

                        <div class="project-icon">
                            <i class="fa-solid fa-wrench"></i>
                        </div>

                        <h2>
                            Time Converter
                        </h2>

                        <h3>
                            Project-1
                        </h3>

                        <a href="./project1/index.html" target="_blank" class="project-btn">
                            Open Programs
                            <i class="bi bi-arrow-right"></i>
                        </a>

                    </div>

                </div>




            </div>


        </div>

        </div>

    </section>


    <!-- ================= FOOTER ================= -->

    <footer>

        <p>
            © 2026 C Programming Projects | GitHub Pages
        </p>

    </footer>


    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>C++ Programs</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }


        /* ================= HEADER ================= */

        header {
            background: linear-gradient(135deg, #111827, #1f2937);
            color: white;
            text-align: center;
            padding: 55px 20px;
        }

        header .icon {
            font-size: 50px;
            margin-bottom: 10px;
            color: #f59e0b;
        }

        header h1 {
            font-size: 40px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        header p {
            font-size: 17px;
            color: #d1d5db;
        }


        /* ================= MAIN ================= */

        .main-section {
            padding: 60px 0;
        }


        /* ================= BACK BUTTON ================= */

        .back-btn {
            display: inline-block;
            text-decoration: none;
            color: white;
            background: #1f2937;
            padding: 10px 18px;
            border-radius: 7px;
            margin-bottom: 35px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #d97706;
            color: white;
            transform: translateY(-2px);
        }


        /* ================= TITLE ================= */

        .section-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .section-title h2 {
            font-size: 32px;
            font-weight: 700;
            color: #24292f;
        }

        .section-title p {
            color: #6b7280;
            margin-top: 8px;
        }


        /* ================= PROGRAM CARD ================= */

        .program-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 15px;
            padding: 30px 25px;
            height: 100%;

            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);

            transition: all 0.3s ease;
        }

        .program-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 14px 32px rgba(31, 41, 55, 0.18);
        }


        /* ================= PROGRAM ICON ================= */

        .program-icon {
            width: 65px;
            height: 65px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #fef3c7;
            color: #d97706;

            border-radius: 50%;

            font-size: 28px;

            margin-bottom: 20px;

            transition: 0.3s;
        }

        .program-card:hover .program-icon {
            background: #d97706;
            color: white;
        }


        /* ================= CARD TEXT ================= */

        .program-card h2 {
            color: #1f2937;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 18px;
        }

        .program-card h3 {
            color: #d97706;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .program-card p {
            color: #6b7280;
            line-height: 1.6;
            min-height: 75px;
        }


        /* ================= BUTTON ================= */

        .btn-program {
            display: inline-block;
            text-decoration: none;

            background: #1f2937;
            color: white;

            padding: 10px 18px;
            border-radius: 7px;

            font-weight: 600;

            transition: 0.3s;
        }

        .btn-program:hover {
            background: #d97706;
            color: white;
            transform: translateY(-2px);
        }


        /* ================= VIDEO ================= */

        .recording-section {
            margin-top: 70px;
            text-align: center;
        }

        .recording-section h2 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 25px;
            color: #1f2937;
        }

        .recording-section video {
            width: 100%;
            max-width: 800px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }


        /* ================= FOOTER ================= */

        footer {
            background: #111827;
            color: white;
            text-align: center;
            padding: 22px 15px;
            margin-top: 50px;
        }

        footer p {
            margin: 0;
            color: #d1d5db;
        }


        /* ================= MOBILE ================= */

        @media (max-width: 768px) {

            header {
                padding: 45px 20px;
            }

            header h1 {
                font-size: 32px;
            }

            .section-title h2 {
                font-size: 27px;
            }

            .main-section {
                padding: 50px 0;
            }

        }


        @media (max-width: 576px) {

            header h1 {
                font-size: 28px;
            }

            header p {
                font-size: 15px;
            }

            .program-card {
                padding: 25px 20px;
            }

            .program-card h2 {
                font-size: 20px;
            }

            .recording-section {
                margin-top: 50px;
            }

            .recording-section h2 {
                font-size: 23px;
            }

        }

    </style>

</head>


<body>


    <!-- ================= HEADER ================= -->

    <header>

        <div class="icon">
            <i class="bi bi-grid-3x3-gap"></i>
        </div>

        <h1>C++ Programs</h1>

        <p>
            My C++ Programming Practice Programs
        </p>

    </header>



    <!-- ================= MAIN SECTION ================= -->

    <section class="main-section">

        <div class="container">


            <!-- ================= BACK BUTTON ================= -->

            <a href="../index1.html" class="back-btn">

                <i class="bi bi-arrow-left"></i>

                Back to Projects

            </a>



            <!-- ================= TITLE ================= -->

            <div class="section-title">

                <h2>My Time Converter Programs</h2>

                <p>
                    Select a program to view the C source code
                </p>

            </div>



            <!-- ================= PROGRAM CARDS ================= -->

            <div class="row g-4">


                <!-- ================= TIME CONVERTER ================= -->

                <div class="col-lg-4 col-md-6">

                    <div class="program-card">

                        <div class="program-icon">

                           <i class="fa-solid fa-clock"></i>
                        </div>

                        <h2>
                            Time Converter
                        </h2>

                        <a href="./time_converter.cpp" class="btn-program">

                            View Program

                            <i class="bi bi-arrow-right"></i>

                        </a>

                    </div>

                </div>



            </div>



            <!-- ================= RECORDING ================= -->

            <div class="recording-section">

                <h2>
                    🎥 All Programs Screen Recording
                </h2>

                <video controls poster="./1_time converter'.png">

                    <source src="./time converter.webm" type="video/webm">

                    Your browser does not support the video tag.

                </video>

            </div>


        </div>

    </section>



    <!-- ================= FOOTER ================= -->

    <footer>

        <p>
            © 2026 C Programming Projects | GitHub Pages
        </p>

    </footer>



    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="4" align="center" cellpadding="20" width="60%">
        <tr>
            <td>
                <h1 align="center"> Job Application Form</h1>
                <form>
                <table border="5" align="center" style="border-color: black;" cellpadding="10">
                <tr>
                    <td>Full Name:</td>
                    <td><input type="text" placeholder="Enter Your Name"></td>
                </tr>
                <tr>
                    <td>Email Address:</td>
                    <td><input type="email"></td>
                </tr>
                <tr>
                    <td>Phone Number:</td>
                    <td><input type="tel" placeholder="123-456-7890"></td>
                </tr>
                <tr>
                    <td>Gender:</td>
                    <td >
                        <input type="radio" name="gen">male
                        <input type="radio" name="gen">female
                     </td>
                </tr>
                <tr>
                    <td>Job Role:</td>
                    <td>
                        <select>
                            <option>--select role--</option>
                            <option>web devoloper</option>
                            <option>designing</option>
                            <option>cyber security</option>
                            <option>software engineer</option>

                        </select>
                    </td>
                </tr>
                    <tr>
                        <td>Date Of Birth:</td>
                        <td><input type="date"></td>
                    </tr>

                    <tr>
                        <td>Favourite Color:</td>
                        <td><input type="color"></td>
                    </tr>

                    <tr>
                        <td>Upload Resume:</td>
                        <td><input type="file"></td>
                    </tr>

                    <tr>
                        <td>Skills:</td>
                        <td>
                            <input type="checkbox">html
                            <input type="checkbox">css
                            <input type="checkbox">javascript
                            <input type="checkbox">react js
                        </td>
                    </tr>
                    <tr>
                        <td>Cover Letter:</td>
                        <td>
                            <textarea placeholder="write something about yourself..."></textarea>
                        </td>
                    </tr>
                    <tr>
                        <td align="center" colspan="2">
                        
                            <input type="submit" value="submit">
                            <input type="reset" value="reset">
                        </td>
                    </tr>
            </td>
        </tr>
    </form>
    </table>
</table>
</body>
</html>

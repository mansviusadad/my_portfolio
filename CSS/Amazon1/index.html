<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <header>
   <div class="logo">
        <img src="logo.png" alt="">
    </div>

    <nav>
        <ul>
            <li>Home</li>
            <li class="active">Movies</li>
            <li>TV Shows</li>
            <li>Live TV</li>
            <li>Prime</li>
            <li>Subscriptions</li>
        </ul>
    </nav>

    <div class="icons">
        <i class="fa-solid fa-magnifying-glass"></i>

        <select>
            <option>EN</option>
            <option>HI</option>
        </select>

        <i class="fa-solid fa-table-cells-large"></i>

        <i class="fa-solid fa-circle-user"></i>

        <button>Join Prime</button>
    </div>

</header>

<section class="banner">

    <i class="fa-solid fa-chevron-left arrow left"></i>

    <div class="content">

        <img src="prime.png"class="prime">

        <h1>CRAZXY</h1>

        <p>#3 in India</p>

        <h3>
            Abhimanyu Sood. Good surgeon. Bad father.
            Questionable human being...
        </h3>

        <div class="btns">

            <button class="watch">
                Join Prime <br> Watch now
            </button>

            <button><i class="fa-solid fa-plus"></i></button>

            <button><i class="fa-solid fa-circle-info"></i></button>
            
        </div>
        <h4 class="h4"> <i class="fa-solid fa-bag-shopping" style="color: rgb(221, 200, 17);"></i> Watch with a prime membership</h4>


    </div>

    <i class="fa-solid fa-chevron-right arrow right"></i>

</section>
<div class="card-section">
    <h1>Movies</h1>
</div>
</body>
</html>
